<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Security research and CTF writeup by Fuad Mohammed Umer" />
  <title>Security Article | FMU.sec</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #050810;
      --bg2: #0b1120;
      --green: #00ff88;
      --blue: #00bfff;
      --purple: #9333ea;
      --text: #e2e8f0;
      --muted: #8290a5;
      --border: rgba(0, 255, 136, .16);
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Inter', sans-serif;
      --code: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0, rgba(0, 255, 136, .06), transparent 34rem), var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.7;
    }

    a { color: inherit; }

    .article-nav {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem max(1rem, calc((100% - 1040px) / 2));
      background: rgba(5, 8, 16, .9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 255, 136, .1);
    }

    .brand, .back-link, .article-kicker, .article-meta, .tag {
      font-family: var(--mono);
    }

    .brand {
      color: var(--green);
      letter-spacing: 2px;
      text-decoration: none;
    }

    .brand span { color: var(--blue); }

    .back-link {
      color: var(--muted);
      font-size: .8rem;
      text-decoration: none;
      transition: color .25s;
    }

    .back-link:hover { color: var(--green); }

    main {
      width: min(100% - 2rem, 860px);
      margin: 0 auto;
      padding: clamp(3rem, 8vw, 7rem) 0 5rem;
    }

    .article-kicker {
      color: var(--green);
      font-size: .78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: .8rem 0 1rem;
      font-family: var(--mono);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.15;
    }

    .article-summary {
      max-width: 700px;
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .article-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .7rem 1rem;
      color: var(--muted);
      font-size: .78rem;
    }

    .category {
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 1.5rem 0 3rem;
    }

    .tag {
      padding: .3rem .7rem;
      border: 1px solid rgba(0, 191, 255, .25);
      border-radius: 999px;
      color: var(--blue);
      background: rgba(0, 191, 255, .08);
      font-size: .72rem;
    }

    .article-content {
      padding-top: 2.5rem;
      border-top: 1px solid rgba(255, 255, 255, .08);
      color: #c5cfdd;
      font-size: 1rem;
    }

    .article-content h2,
    .article-content h3,
    .article-content h4 {
      margin: 2.2rem 0 .7rem;
      color: var(--green);
      font-family: var(--mono);
      line-height: 1.3;
    }

    .article-content h2 { font-size: 1.55rem; }
    .article-content h3 { font-size: 1.2rem; }
    .article-content p { margin: 0 0 1.15rem; }
    .article-content a { color: var(--blue); }
    .article-content ul, .article-content ol { padding-left: 1.4rem; }
    .article-content li::marker { color: var(--green); }

    .article-content pre {
      overflow-x: auto;
      margin: 1.5rem 0;
      padding: 1.1rem;
      border: 1px solid rgba(0, 255, 136, .15);
      border-radius: 8px;
      background: #03060c;
    }

    .article-content code {
      font-family: var(--code);
      color: var(--green);
      font-size: .86em;
    }

    .article-content :not(pre) > code {
      padding: .15rem .35rem;
      border-radius: 4px;
      background: rgba(0, 255, 136, .08);
    }

    .state {
      min-height: 45vh;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: var(--mono);
      text-align: center;
    }

    .error { color: #fca5a5; }

    @media (max-width: 520px) {
      .article-nav { padding: .9rem 1rem; }
      .back-link { font-size: .72rem; }
      main { width: min(100% - 1.5rem, 860px); }
      .article-content { font-size: .94rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

<body>
  <nav class="article-nav">
    <a class="brand" href="index.html#seclab">FM<span>U</span>.sec</a>
    <a class="back-link" href="index.html#seclab">← Back to articles</a>
  </nav>

  <main id="article" aria-live="polite">
    <div class="state">Loading article...</div>
  </main>

  <script>
    const API_BASE = 'https://my-portfolio-06q4.onrender.com/api';
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const article = document.getElementById('article');

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));
    }

    function formatPlatform(platform) {
      const labels = { tryhackme: 'TryHackMe', hackthebox: 'HackTheBox', ctf: 'CTF', vapt: 'VAPT' };
      return labels[platform] || (platform ? platform.charAt(0).toUpperCase() + platform.slice(1) : 'Security Article');
    }

    async function loadArticle() {
      if (!slug) throw new Error('This article URL is missing its slug.');
      const response = await fetch(`${API_BASE}/writeups/slug/${encodeURIComponent(slug)}`);
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || 'Article not found.');

      const writeup = result.data;
      const date = writeup.created_at
        ? new Date(writeup.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
        : 'Published article';
      const tags = (writeup.tags || []).map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join('');
      const content = marked.parse(writeup.content || '_No content available yet._');

      document.title = `${writeup.title} | FMU.sec`;
      article.innerHTML = `
        <div class="article-kicker">// ${escapeHTML(formatPlatform(writeup.platform))}</div>
        <h1>${escapeHTML(writeup.title)}</h1>
        <p class="article-summary">${escapeHTML(writeup.summary || '')}</p>
        <div class="article-meta">
          <span class="category">${escapeHTML(formatPlatform(writeup.platform))}</span>
          <span>•</span>
          <time datetime="${escapeHTML(writeup.created_at || '')}">${escapeHTML(date)}</time>
          <span>•</span>
          <span>${escapeHTML(writeup.difficulty || 'research')}</span>
        </div>
        <div class="tag-list" aria-label="Article tags">${tags || '<span class="tag">Research</span>'}</div>
        <article class="article-content">${content}</article>`;
    }

    loadArticle().catch(error => {
      article.innerHTML = `
        <div class="state error">
          <div>
            <p>Unable to load this article.</p>
            <a class="back-link" href="index.html#seclab">← Return to articles</a>
          </div>
        </div>`;
      console.error('Article loading failed:', error);
    });
  </script>
</body>

</html>
